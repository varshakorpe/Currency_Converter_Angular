<div class="converter-container">
  <h2>💱 Currency Converter</h2>

  <div class="form-group">
    <label>Amount:</label>
    <!-- Use standard input event to update the amount signal -->
    <input 
      type="number" 
      [value]="amount()" 
      (input)="amount.set($any($event.target).valueAsNumber || 0)"
      placeholder="Enter amount"
      min="1"
    />
  </div>

  <div class="currency-selectors">
    <div class="form-group">
      <label>From:</label>
      <select [value]="fromCurrency()" (change)="fromCurrency.set($any($event.target).value)">
        @for (currency of currencies; track currency) {
          <option [value]="currency">{{ currency }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label>To:</label>
      <select [value]="toCurrency()" (change)="toCurrency.set($any($event.target).value)">
        @for (currency of currencies; track currency) {
          <option [value]="currency">{{ currency }}</option>
        }
      </select>
